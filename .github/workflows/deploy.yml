name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-east1-docker.pkg.dev

      - name: Build and push API image
        run: |
          docker build -f Dockerfile.api -t us-east1-docker.pkg.dev/findu23/findu/findu-api:${{ github.sha }} .
          docker push us-east1-docker.pkg.dev/findu23/findu/findu-api:${{ github.sha }}

      - name: Build and push Streamlit image
        run: |
          docker build -f Dockerfile.streamlit -t us-east1-docker.pkg.dev/findu23/findu/findu-app:${{ github.sha }} .
          docker push us-east1-docker.pkg.dev/findu23/findu/findu-app:${{ github.sha }}

      - name: Deploy API to Cloud Run
        run: |
          gcloud run deploy findu-api \
            --image us-east1-docker.pkg.dev/findu23/findu/findu-api:${{ github.sha }} \
            --region us-east1 \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "DATABASE_URL=${{ secrets.DATABASE_URL }}"

      - name: Deploy Streamlit to Cloud Run
        run: |
          gcloud run deploy findu-app \
            --image us-east1-docker.pkg.dev/findu23/findu/findu-app:${{ github.sha }} \
            --region us-east1 \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "API_URL=https://findu-api-534834684098.us-east1.run.app"