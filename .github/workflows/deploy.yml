name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-east1-docker.pkg.dev

      - name: Build and push Docker image
        run: |
          docker build -t us-east1-docker.pkg.dev/findu23/findu/findu:${{ github.sha }} .
          docker push us-east1-docker.pkg.dev/findu23/findu/findu:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy findu \
            --image us-east1-docker.pkg.dev/findu23/findu/findu:${{ github.sha }} \
            --region us-east1 \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "DATABASE_URL=${{ secrets.DATABASE_URL }}" \
            --set-env-vars "API_URL=http://localhost:8000"