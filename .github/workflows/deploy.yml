name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-east1-docker.pkg.dev

      - name: Build and push API image
        run: |
          docker build -f Dockerfile.api -t us-east1-docker.pkg.dev/findu23/findu/findu-api:${{ github.sha }} .
          docker push us-east1-docker.pkg.dev/findu23/findu/findu-api:${{ github.sha }}

      - name: Build and push React image
        run: |
          docker build -f Dockerfile.web -t us-east1-docker.pkg.dev/findu23/findu/findu-web:${{ github.sha }} .
          docker push us-east1-docker.pkg.dev/findu23/findu/findu-web:${{ github.sha }}

      - name: Deploy API to Cloud Run
        run: |
          gcloud run deploy findu-api \
            --image us-east1-docker.pkg.dev/findu23/findu/findu-api:${{ github.sha }} \
            --region us-east1 \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "DATABASE_URL=${{ secrets.DATABASE_URL }},ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }},SECRET_KEY=${{ secrets.SECRET_KEY }},FINDU_APP_PASSWORD=${{ secrets.FINDU_APP_PASSWORD }},GOOGLE_CLIENT_ID=534834684098-77kkt85g117634fogl615t1jrerjgblt.apps.googleusercontent.com,ALLOWED_GOOGLE_EMAILS=${{ secrets.ALLOWED_GOOGLE_EMAILS }},EXCHANGE_RATE_API_KEY=${{ secrets.EXCHANGE_RATE_API_KEY }}"

      - name: Deploy React to Cloud Run
        run: |
          gcloud run deploy findu-web \
            --image us-east1-docker.pkg.dev/findu23/findu/findu-web:${{ github.sha }} \
            --region us-east1 \
            --platform managed \
            --allow-unauthenticated \
            --port 8080
