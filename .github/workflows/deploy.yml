name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      API_IMAGE: us-east1-docker.pkg.dev/findu23/findu/findu-api:${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-east1-docker.pkg.dev

      - name: Build and push API image
        run: |
          docker build -f Dockerfile.api -t "$API_IMAGE" .
          docker push "$API_IMAGE"

      - name: Build and push React image
        run: |
          docker build -f Dockerfile.web -t us-east1-docker.pkg.dev/findu23/findu/findu-web:${{ github.sha }} .
          docker push us-east1-docker.pkg.dev/findu23/findu/findu-web:${{ github.sha }}

      - name: Back up database before migration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          docker run --rm --env DATABASE_URL postgres:17 sh -c 'pg_dump --dbname="$DATABASE_URL" --format=custom --no-owner --no-acl' > pre-migration.dump
          test -s pre-migration.dump
          docker run --rm -v "$PWD:/backup:ro" postgres:17 pg_restore --file=/dev/null /backup/pre-migration.dump

      - name: Store verified backup
        uses: actions/upload-artifact@v4
        with:
          name: financial-database-before-${{ github.sha }}
          path: pre-migration.dump
          retention-days: 7
          if-no-files-found: error

      - name: Record financial totals before migration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: docker run --rm --env DATABASE_URL "$API_IMAGE" python scripts/financial_snapshot.py > before-financial.json

      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          docker run --rm --env DATABASE_URL "$API_IMAGE" alembic upgrade head

      - name: Verify financial totals after migration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          docker run --rm --env DATABASE_URL "$API_IMAGE" python scripts/financial_snapshot.py > after-financial.json
          diff -u before-financial.json after-financial.json

      - name: Deploy API to Cloud Run
        run: |
          gcloud run deploy findu-api \
            --image "$API_IMAGE" \
            --region us-east1 \
            --platform managed \
            --allow-unauthenticated \
            --min-instances=1 \
            --cpu-boost \
            --remove-env-vars FINDU_APP_PASSWORD \
            --update-env-vars "^|^DATABASE_URL=${{ secrets.DATABASE_URL }}|ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}|GOOGLE_CLIENT_ID=534834684098-77kkt85g117634fogl615t1jrerjgblt.apps.googleusercontent.com|ALLOWED_GOOGLE_EMAILS=${{ secrets.ALLOWED_GOOGLE_EMAILS }}|EXCHANGE_RATE_API_KEY=${{ secrets.EXCHANGE_RATE_API_KEY }}"

      - name: Deploy React to Cloud Run
        run: |
          gcloud run deploy findu-web \
            --image us-east1-docker.pkg.dev/findu23/findu/findu-web:${{ github.sha }} \
            --region us-east1 \
            --platform managed \
            --allow-unauthenticated \
            --port 8080
