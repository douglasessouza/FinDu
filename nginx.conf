server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/css
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass https://findu-api-uwii3tfcqa-ue.a.run.app/;
        proxy_set_header Host findu-api-uwii3tfcqa-ue.a.run.app;
        proxy_set_header Authorization $http_authorization;
    }
}
